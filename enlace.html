<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/herramienta.webmanifest">
<meta name="theme-color" content="#12302E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MF Agencias">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Crear enlace de maleta · Maleta Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#12302E;--teal5:#2E827C;--paper:#F6F1E4;--rust:#B65B3F;--line:#E0D6C2}
*{box-sizing:border-box}
body{margin:0;background:var(--teal);font-family:'Work Sans',sans-serif;color:var(--teal);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;color:var(--paper);margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:10px;background:var(--paper);position:relative;display:flex;align-items:center;justify-content:center;font:700 25px Fraunces,serif;color:var(--teal)}
.logo:after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--rust)}
.brandAg{margin-left:4px;padding-left:14px;border-left:1px solid rgba(246,241,228,.28);height:46px;min-width:0;flex:0 1 auto;display:flex;align-items:center}.brandAg.hide{display:none}.brandAg img{max-height:42px;max-width:100%;border-radius:8px;display:block;object-fit:contain}.brandAg span{font:600 15px Fraunces,serif;color:var(--paper);text-align:left;line-height:1.15}
.brand b{font:600 19px Fraunces,serif;display:block;line-height:1.1;margin-bottom:4px}
.etq{display:inline-flex;align-items:center;gap:5px;background:#8B5A2B;color:var(--paper);font:600 11px 'Work Sans',sans-serif;padding:3px 9px;border-radius:100px}
h1{font:700 26px/1.15 Fraunces,serif;color:var(--paper);margin:16px 0 4px}
.sub{color:#9FC2BC;font-size:14px;margin:0 0 16px}
.tabs{display:flex;gap:6px;background:rgba(246,241,228,.1);padding:5px;border-radius:100px;margin-bottom:14px}
.tabs button{flex:1;background:none;color:var(--paper);font:700 14px 'Work Sans',sans-serif;border:0;border-radius:100px;padding:11px 8px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--paper);color:var(--teal)}
.card{background:var(--paper);border-radius:18px;padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#4A5A57}
input,select{width:100%;font:500 16px 'Work Sans',sans-serif;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--teal)}
input:focus,select:focus{outline:none;border-color:var(--teal5)}
.f{margin-bottom:14px}
.row{display:flex;gap:10px}.row .f{flex:1;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:50px;line-height:22px;text-align:left}
.hint{font-size:12px;color:#7A7468;margin-top:5px;line-height:1.4}
.out{margin-top:16px;background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:none}
.out.show{display:block}
.msg{white-space:pre-wrap;font-size:14.5px;line-height:1.45;margin:0 0 10px}
.link{font-size:12.5px;color:var(--teal5);word-break:break-all;margin:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button,.btn{font:700 15px 'Work Sans',sans-serif;border:0;border-radius:100px;padding:12px;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.wa{background:#25D366;color:#0B3B21}
.copy{background:var(--teal);color:var(--paper)}
.test{background:#F5C86A;color:var(--teal)}
.err{color:var(--rust);font-size:13px;font-weight:600;margin-top:8px;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--teal);font-weight:700;padding:10px 18px;border-radius:100px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.hide{display:none!important}
.drop{border:2px dashed var(--teal5);border-radius:14px;padding:22px 14px;text-align:center;background:#fff;cursor:pointer}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.map select{font-size:14px;padding:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.bar b{font-size:15px}
.bar select{width:auto;font-size:14px;padding:8px 10px}
.item{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item.sent{opacity:.55}
.item h3{margin:0 0 2px;font-size:16px}
.item p{margin:0;font-size:13px;color:#6B6558}
.item .ib{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .ib .btn,.item .ib button{flex:1;min-width:92px;font-size:13.5px;padding:10px;min-height:42px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;color:#4A5A57}
.chk input{width:auto}
.dl{background:var(--teal);color:var(--paper);margin-top:6px;width:100%}
.login{background:var(--paper);border-radius:18px;padding:22px 18px}
.login h2{font:700 20px Fraunces,serif;margin:0 0 4px}
.ok{background:var(--teal);color:var(--paper);width:100%;margin-top:6px}
.salir{background:none;color:#9FC2BC;font-size:13px;min-height:auto;padding:6px;margin:14px auto 0;text-decoration:underline}
.ultx{background:#E3EFEC;color:#2E5E59;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">M</div><div><b>Maleta Fácil</b><span class="etq">✈ Equipaje sin estrés</span></div><div class="brandAg hide" id="brandAg"></div></div>
<h1>Crear enlace de maleta</h1>
<p class="sub">Envía a tus clientes su maleta ya preparada, con su destino y sus fechas.</p>

<div id="login" class="login">
<h2>Acceso</h2><p class="hint" style="margin:0 0 14px">Herramienta privada de Maleta Fácil para agencias.</p>
<div class="f"><label for="usuario">Email de la agencia</label><input id="usuario" type="email" placeholder="reservas@tuagencia.es"></div>
<div class="f"><label for="clave">Contraseña</label><input id="clave" type="password"></div>
<button type="button" class="ok" id="entrar">Entrar</button>
<p class="err" id="errL"></p>
</div>

<div id="app" class="hide">
<div class="tabs"><button type="button" id="tVarios" class="on">Excel / Reservas</button><button type="button" id="tUno">Un cliente</button></div>

<!-- VARIOS EXCEL -->
<div id="pVarios">
<p class="ultx hide" id="ultExcel"></p>
<label class="drop" for="fichero"><b>Subir Excel de reservas</b><span class="hint">Archivo .xlsx o .csv exportado de tu programa de gestión</span></label>
<input type="file" id="fichero" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hide">
<p class="err" id="errX"></p>
<div id="mapWrap" class="hide">
<div id="mapaCols">
<p class="hint" style="margin-top:14px">Mapeo de columnas detectado de tu Excel:</p>
<div class="map">
<div><label>Expediente / Nombre</label><select data-k="nombre"></select></div>
<div><label>Descripción / Destino *</label><select data-k="destino"></select></div>
<div><label>Fecha Salida *</label><select data-k="ida"></select></div>
<div><label>Fecha Regreso</label><select data-k="vuelta"></select></div>
<div><label>Teléfono</label><select data-k="tel"></select></div>
</div>
</div>
<div class="bar"><b id="cuenta"></b>
<select id="rango"><option value="7">Próximos 7 días</option><option value="15">Próximos 15 días</option><option value="30">Próximos 30 días</option><option value="9999" selected>Todos los futuros</option></select></div>
<div id="lista"></div>
<button type="button" class="dl" id="descargar">Descargar lista con enlaces (.csv)</button>
</div>
</div>

<!-- UN CLIENTE -->
<div id="pUno" class="hide">
<div class="card">
<div class="f"><label for="cliente">Nombre del cliente</label><input id="cliente" placeholder="Ej. Ana"></div>
<div class="f"><label for="telCli">Teléfono</label><input id="telCli" type="tel" placeholder="Ej. 612 345 678"></div>
<div class="f"><label for="destino">Destino</label><input id="destino" placeholder="Ej. Madrid, Quito, Londres..."></div>
<div class="f"><label for="ida">Fecha de Salida</label><input id="ida" type="date"></div>
<div class="f"><label for="vuelta">Fecha de Regreso</label><input id="vuelta" type="date"></div>
</div>
<div class="out" id="out">
<p class="msg" id="msg"></p>
<p class="link" id="link"></p>
<div class="btns"><a class="btn wa" id="wa" target="_blank" rel="noopener">📲 Enviar WhatsApp</a><button type="button" class="copy" id="copiar">Copiar mensaje</button></div>
</div>
</div>

<button type="button" class="salir" id="salir">Cerrar sesión</button>
</div>
</div>
<div class="toast" id="toast">¡Copiado!</div>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

// Diccionario para traducir códigos IATA de aeropuertos a nombres de ciudad
const AEROPUERTOS = {
  'MAD':'Madrid','UIO':'Quito','GYE':'Guayaquil','BCN':'Barcelona','JFK':'Nueva York','EZE':'Buenos Aires',
  'MEX':'Ciudad de México','BOG':'Bogotá','LIM':'Lima','CDG':'París','FCO':'Roma','LIS':'Lisboa','LHR':'Londres',
  'AMS':'Ámsterdam','FRA':'Fráncfort','MUC':'Múnich','DUB':'Dublín','OPO':'Oporto','MIA':'Miami','CUN':'Cancún',
  'PUJ':'Punta Cana','HAV':'La Habana','VCE':'Venecia','VIE':'Viena','PRG':'Praga','BUD':'Budapest','ATH':'Atenas'
};

function traducirAeropuertos(texto) {
  if (!texto) return '';
  let str = String(texto).trim();
  const codigos = str.match(/\b[A-Z]{3}\b/g);
  if (codigos && codigos.some(c => AEROPUERTOS[c])) {
    const ciudades = codigos.map(c => AEROPUERTOS[c] || c);
    return ciudades.length > 1 ? ciudades[1] : ciudades[0];
  }
  return str;
}

function limpiarTelefono(tel) {
  if (!tel) return '';
  let limpio = String(tel).replace(/\D/g, '');
  if (limpio.length === 9) limpio = '34' + limpio;
  return limpio;
}

function toast(t){$('toast').textContent=t||'¡Copiado!';$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1500)}
function copiar(t){navigator.clipboard.writeText(t).then(()=>toast());}

// Pestañas
$('tUno').onclick=()=>{$('tUno').classList.add('on'); $('tVarios').classList.remove('on');$('pUno').classList.remove('hide'); $('pVarios').classList.add('hide'); };$('tVarios').onclick=()=>{ $('tVarios').classList.add('on');$('tUno').classList.remove('on'); $('pVarios').classList.remove('hide');$('pUno').classList.add('hide'); };

$('entrar').onclick=()=>{$('login').classList.add('hide'); $('app').classList.remove('hide'); };$('salir').onclick=()=>{ $('login').classList.remove('hide');$('app').classList.add('hide'); };

/* Lector CSV / XLSX */
let cab=[], filas=[], mapa={};
const CAMPOS=['nombre','destino','ida','vuelta','tel'];
const ADIV={
  nombre:/expediente|titular|nombre|cliente|pax/i,
  destino:/descripci[oó]n|destino|ciudad|itinerario/i,
  ida:/salida|ida|inicio|fecha ini/i,
  vuelta:/regreso|vuelta|fin|fecha fin/i,
  tel:/tel[eé]f|contacto|m[oó]vil|whats/i
};

function aFecha(v){
  v=String(v||'').trim(); if(!v) return '';
  if(/^\d{4,5}(\.\d+)?$/.test(v)){
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(parseFloat(v))*86400000);
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }
  let m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){let y=+m[3]; if(y<100)y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`;}
  return '';
}

$('fichero').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  const txt = await f.text();
  const rows = txt.split('\n').map(r=>r.split(/;|,/));
  cab = rows[0].map(c=>c.trim().replace(/^"|"$/g,''));
  filas = rows.slice(1).filter(r=>r.length>1);

  CAMPOS.forEach(k=>{ mapa[k] = cab.findIndex(h=>ADIV[k].test(h)); });

  document.querySelectorAll('.map select').forEach(sel=>{
    const k=sel.dataset.k;
    sel.innerHTML='<option value="-1">— No está —</option>'+cab.map((h,i)=>`<option value="${i}">${h}</option>`).join('');
    sel.value=String(mapa[k]);
    sel.onchange=()=>{ mapa[k]=+sel.value; pintarLista(); };
  });

  $('mapWrap').classList.remove('hide');
  pintarLista();
});

let visibles=[];
function pintarLista(){
  const val=(r,k)=>mapa[k]>=0?String(r[mapa[k]]||'').replace(/^"|"$/g,'').trim():'';
  visibles = filas.map(r=>({
    nombre: val(r,'nombre'),
    destino: traducirAeropuertos(val(r,'destino')),
    ida: aFecha(val(r,'ida')),
    vuelta: aFecha(val(r,'vuelta')),
    tel: limpiarTelefono(val(r,'tel'))
  })).filter(r=>r.destino && r.ida);

  $('cuenta').textContent = `${visibles.length} reservas encontradas`;
  $('lista').innerHTML = '';

  visibles.forEach(r=>{
    const url = `https://maletafacil.com/?destino=${encodeURIComponent(r.destino)}&ida=${r.ida}&vuelta=${r.vuelta}`;
    const msg = `¡Hola ${r.nombre}! 🧳 Aquí tienes tu maleta preparada para tu viaje a *${r.destino}*:\n${url}\n\n¡Buen viaje!`;

    const d = document.createElement('div'); d.className='item';
    d.innerHTML = `<h3>${r.nombre} · ${r.destino}</h3><p>Salida: ${r.ida} ${r.vuelta?'| Regreso: '+r.vuelta:''}</p>
    <div class="ib"><a class="btn wa" href="https://wa.me/${r.tel}?text=${encodeURIComponent(msg)}" target="_blank">WhatsApp</a><button type="button" class="copy">Copiar</button></div>`;
    d.querySelector('.copy').onclick=()=>copiar(msg);
    $('lista').appendChild(d);
  });
}
</script>
</body>
</html>
